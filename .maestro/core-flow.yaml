# Core flow, end to end: onboarding → 5 lessons → unit quiz (pass) → unit 2 unlocked.
# Runs against Expo Go with Metro on port 8081:  bun run start  then  bun run e2e
appId: host.exp.Exponent
name: Core learning flow
---
# Restart so the app opens on its first screen, whatever a previous run left open.
- stopApp
- openLink: exp://127.0.0.1:8081?__expo_disable_fab=1&__expo_disable_onboarding=1
- extendedWaitUntil:
    visible:
      text: 'octolearn|Нүүр'
    timeout: 60000

# Start from a clean slate: reset any saved progress through the app itself.
- runFlow:
    when:
      visible: 'Нүүр'
    file: subflows/reset-progress.yaml

# Onboarding: three quick questions, the reminder offer, then a name.
- assertVisible: 'octolearn'
- tapOn: 'Эхлэх'
- tapOn: 'Аялалд'
- tapOn: 'Үргэлжлүүлэх'
- tapOn: 'Шинээр эхэлж байна'
- tapOn: 'Үргэлжлүүлэх'
- tapOn: '10 минут / өдөр'
- tapOn: 'Тохирлоо!'
# Skipped when reminders are already on.
- runFlow:
    when:
      visible: 'Одоо биш'
    commands:
      - tapOn: 'Одоо биш'
- tapOn: 'Таны нэр'
- inputText: 'Тэмүүлэн'
- tapOn: 'Эхлэх'
- extendedWaitUntil:
    visible: '0 / 10 хичээл · 0%'
    timeout: 10000

# A locked lesson explains what to finish first.
- tapOn: 'Өөрийгөө танилцуулах, түгжээтэй'
- assertVisible: '.*Мэндчилгээ.*'

# Watch and finish every lesson in unit 1.
- runFlow:
    file: subflows/complete-lesson.yaml
    env:
      LESSON: 'Мэндчилгээ'
- assertVisible: '1 / 10 хичээл · 10%'
- runFlow:
    file: subflows/complete-lesson.yaml
    env:
      LESSON: 'Өөрийгөө танилцуулах'
- runFlow:
    file: subflows/complete-lesson.yaml
    env:
      LESSON: 'Хаанаас ирсэн бэ?'
- runFlow:
    file: subflows/complete-lesson.yaml
    env:
      LESSON: 'Тоо 1–10'
- runFlow:
    file: subflows/complete-lesson.yaml
    env:
      LESSON: 'Салах ёс'
- assertVisible: '5 / 10 хичээл · 50%'

# Unit quiz: answer all five correctly.
- tapOn: 'Бүлгийн шалгалт, идэвхтэй'
- runFlow:
    file: subflows/answer.yaml
    env: { OPTION: 'B, Сайн байна уу', NEXT: 'Үргэлжлүүлэх' }
- runFlow:
    file: subflows/answer.yaml
    env: { OPTION: 'A, Намайг Болд гэдэг', NEXT: 'Үргэлжлүүлэх' }
- runFlow:
    file: subflows/answer.yaml
    env: { OPTION: 'B, I am from Mongolia.', NEXT: 'Үргэлжлүүлэх' }
- runFlow:
    file: subflows/answer.yaml
    env: { OPTION: 'C, 7', NEXT: 'Үргэлжлүүлэх' }
- runFlow:
    file: subflows/answer.yaml
    env: { OPTION: 'A, Дараа уулзъя!', NEXT: 'Дүнгээ харах' }
- extendedWaitUntil:
    visible: 'Тэнцлээ!'
    timeout: 10000
# The score card is one accessibility element, read as a sentence.
- assertVisible: '5 асуултаас 5 зөв, 100%'
- tapOn: 'Үргэлжлүүлэх'

# Passing opens unit 2.
- extendedWaitUntil:
    visible: 'Баярлалаа, уучлаарай, идэвхтэй'
    timeout: 10000
