# Resets saved progress from Settings, which returns the app to onboarding.
appId: host.exp.Exponent
---
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element: 'Ахиц дахин эхлүүлэх'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn: 'Ахиц дахин эхлүүлэх'
- tapOn: 'Тийм, дахин эхлүүлэх'
- extendedWaitUntil:
    visible: 'Англи хэлийг өдөр бүр, хөгжилтэйгээр.'
    timeout: 10000
