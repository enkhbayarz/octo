# Signs out from Settings (confirming the alert), which returns the app to the welcome screen.
appId: host.exp.Exponent
---
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element: 'Гарах'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn: 'Гарах'
# A tap lands before the alert accepts touches unless it has finished appearing.
- extendedWaitUntil:
    visible: 'Профайлаас гарах уу?'
    timeout: 5000
- waitForAnimationToEnd
# The alert's confirm button has the same label; it is the second match.
- tapOn:
    text: 'Гарах'
    index: 1
- extendedWaitUntil:
    visible: 'Англи хэлийг өдөр бүр, хөгжилтэйгээр.'
    timeout: 15000
